<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>剪藏到 onenote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="mainView">
    <header>
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <h1>剪藏到 onenote</h1>
      <button id="openSettings" class="icon-btn" type="button" aria-label="插件设置">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2-1.2L14.6 3h-5.2L9 5.7a7.6 7.6 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7.4 7.4 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2 1.2L9.4 21h5.2l.4-2.7a7.6 7.6 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>
      </button>
    </header>
    <p id="connStatus" class="status" role="status" aria-live="polite">正在连接应用…</p>
    <div class="field">
      <label for="notebookSelect">存入笔记本</label>
      <select id="notebookSelect" disabled></select>
    </div>
    <div class="field">
      <label for="titleInput">笔记标题</label>
      <input id="titleInput" autocomplete="off" placeholder="默认使用网页标题">
    </div>
    <div class="actions">
      <button id="clipArticle" class="primary" type="button" disabled>剪藏正文</button>
      <button id="clipSelection" type="button" disabled>剪藏选中内容</button>
      <button id="clipFullpage" type="button" disabled>剪藏整页</button>
      <button id="clipShot" type="button" disabled>剪藏截图</button>
      <button id="clipBookmark" type="button" disabled>收藏网址</button>
    </div>
    <input id="shotFile" type="file" accept="image/*" hidden>
    <p id="result" class="result" role="status" aria-live="polite"></p>
  </main>
  <section id="settingsView" hidden>
    <header>
      <button id="closeSettings" class="icon-btn" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>插件设置</h1>
    </header>
    <div class="field">
      <label for="portInput">桥接端口</label>
      <input id="portInput" inputmode="numeric" autocomplete="off" placeholder="41190">
      <p class="hint">与应用设置页「剪藏 · 桥接端口」一致，默认 41190</p>
      <p id="portError" class="error" hidden>请输入 1024–65535 的整数端口</p>
    </div>
    <div class="field">
      <label for="tokenInput">配对令牌</label>
      <div class="token-row">
        <input id="tokenInput" type="password" autocomplete="off" spellcheck="false">
        <button id="toggleToken" class="icon-btn" type="button" aria-label="显示令牌" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
        </button>
      </div>
      <p class="hint">应用设置页「剪藏 · 配对令牌」点击复制后粘贴到这里</p>
    </div>
    <button id="saveSettings" class="primary" type="button">保存并连接</button>
    <p id="settingsResult" class="result" role="status" aria-live="polite"></p>
    <p class="hint">剪藏时应用需保持运行且已启用剪藏服务。插件未上架，通过 chrome://extensions 开发者模式加载仓库 extension/chrome 目录。</p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
